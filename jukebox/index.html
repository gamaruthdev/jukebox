<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Jukebox</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0px;
            background-color: #413A3A;
        }


        header {
            display: flex;
            align-items: center;
            margin: 20px;
            font-size: medium;
            color: antiquewhite;
        }

        h1 {
            display: flex;
            align-items: center;
            justify-content: center;
            color: antiquewhite;
        }

        .Searching_song {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 15px;
            gap: 10px;
        }

        .Searching_song>input {
            width: 100%;
            background-color: #D9D9D9;
            border-radius: 20px;
            padding: 5px;
            padding-left: 15px;
        }

        .Searching_song>button {
            border-radius: 20px;
            padding: 10px;
            background-color: #16A570;
            cursor: pointer;

        }

        .filters_navigations {
            display: flex;
            flex-wrap: wrap;
        }

        .button_default {
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .button_default img {
            width: 150px;
            border-radius: 20px;
        }

        .button-default {
            border-style: none;
            cursor: pointer;
        }

        .button_default h3 {
            color: antiquewhite;
        }
    </style>

</head>

<body>
    <header>
        <img class="logotipo"> Logotipo </h1>
    </header>

    <h1> Escolha uma música </h1>

    <div class="Searching_song">
        <input id="buscaMusica" placeholder="Busque uma música ou artista..." type="text"> </input>
        <button onclick="buscarMusicas()"> Buscar </button>
    </div>

    <div class="filters_navigations">
        <div class="button_default">
            <button class="button-default">
                <img src="filter_musica.png" alt="seção de músicas">
                <h3> Músicas </h3>
            </button>

        </div>

        <div class="button_default">
            <button class="button-default">
                <img src="filter_random.png" alt="seção de sorteio">
                <h3> Sorteio </h3>
            </button>
        </div>

        <div class="button_default">
            <button class="button-default">
                <img src="filter_inter.png" alt="seção de músicas internacional">
                <h3> Internacionais </h3>
            </button>
        </div>

        <div class="button_default">
            <button class="button-default">
                <img src="filter_national.png" alt="seção de música nacional">
                <h3> Nacionais </h3>
            </button>
        </div>

        <div class="button_default">
            <button class="button-default">
                <img src="filter_genero.png" alt="Seção de músicas por genero">
                <h3> Gêneros </h3>
            </button>
        </div>

        <div class="button_default">
            <button class="button-default">
                <img src="filter_artist.png" alt="seção de artistas">
                <h3> Artistas </h3>
            </button>
        </div>

    </div>

    <div class="sugestion-song" <input class="sugestion" placeholder="Sugira uma música"> </input>
    </div>

</body>
